    <link rel="preconnect" href="https://wnbgmltynsdpmnlpsceh.supabase.co" crossorigin>

    <link rel="stylesheet" href="/css/styles.css">

    <!--
      El tema se aplica ANTES de pintar nada, en un script bloqueante y chico.
      Si se dejara para el módulo (que es defer), la página arrancaría en
      oscuro y saltaría a claro una vez cargado el JS: el "flash" blanco que
      se ve al entrar. Esto es de las pocas veces que un script bloqueante en
      el <head> es lo correcto.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") || "dark";
          document.documentElement.dataset.temaInicial = t;
        } catch (e) { /* almacenamiento bloqueado: queda el oscuro por defecto */ }
      })();
    </script>
</head>
<body class="dark-theme">

    <a href="#listado" class="skip-link">Ir a los proyectos</a>

    <div class="bg-gradient-shapes" aria-hidden="true">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <header class="header">
        <div class="header-container">
            <a href="/" class="logo">
                <span class="logo-accent">&lt;</span>Ariel<span class="logo-accent">.Dev /&gt;</span>
            </a>

            <nav class="nav-menu">

                <a href="/proyectos" class="nav-link active" aria-current="page">Proyectos</a>

            <div class="header-actions">

                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
                <a href="/#cotizador" class="btn btn-primary btn-sm hide-mobile">Cotizar Web</a>
            </div>
        </div>
    </header>

    <main class="proyectos-main">
        <div class="container">

            <a href="/#portfolio" class="volver-link">

                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
                </svg>
                Volver al inicio
            </a>

            <div class="section-header proyectos-header">

                <h1 class="section-title">Todos los proyectos</h1>
                <p class="section-desc" id="proyectos-conteo"></p>

            <!--
