<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Portal privado: no se indexa nunca. -->
  <meta name="robots" content="noindex, nofollow, noarchive">

  <!-- Evita que el token viaje en la cabecera Referer al abrir la demo.
       Sin esto, el link privado queda en los logs de cualquier sitio visitado. -->
  <meta name="referrer" content="no-referrer">

  <title>Tu proyecto · Ariel.Dev</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/portal.css">
</head>

<body class="portal-body">

  <a class="skip-link" href="#portal-main">Ir al contenido</a>

  <header class="portal-top" id="portal-header">
    <span class="portal-marca"><span class="portal-marca-punto" aria-hidden="true"></span>Ariel.Dev</span>
    <span class="portal-privado">
      <svg class="pico pico-sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      Link privado
    </span>
  </header>

  <main id="portal-main" class="portal-main">

    <!-- Cargando -->
    <section id="portal-cargando" class="portal-centro">
      <div class="portal-spinner" aria-hidden="true"></div>
      <p>Buscando tu proyecto…</p>
    </section>

    <!-- Link inválido -->
    <section id="portal-invalido" class="portal-centro hidden">
      <h1>Este link no es válido</h1>
      <p>Puede que esté incompleto o que se haya dado de baja. Escribime y te paso uno nuevo en el momento.</p>
      <a class="btn btn-primary" id="portal-wa-ayuda" href="#" target="_blank" rel="noopener noreferrer">
        Escribirme por WhatsApp
      </a>
    </section>

    <!-- Portal -->
    <section id="portal-contenido" class="hidden">

      <!-- Saludo + avance + los 5 pasos, todo en un bloque -->
      <div class="portal-hero">
        <div class="portal-hero-fila">
          <div class="portal-hero-txt">
            <h1 id="pc-saludo">Hola</h1>
            <p class="portal-hero-proyecto" id="pc-proyecto"></p>
          </div>
          <p class="portal-hero-num">
            <b id="pc-progreso-num">0</b>
            <span>Avance</span>
          </p>
        </div>

        <div class="portal-barra" role="progressbar" aria-valuemin="0" aria-valuemax="100"
             aria-valuenow="0" aria-label="Avance del proyecto" id="pc-barra-wrap">
          <i id="pc-barra"></i>
        </div>

        <ol class="portal-pasos" id="pc-pasos"></ol>
      </div>

      <!-- La tarjeta de la etapa actual. La arma cliente.js -->
      <div id="pc-etapa"></div>

      <footer class="portal-pie">
        <span>Cualquier duda me escribís por WhatsApp.</span>
        <a class="btn btn-outline btn-sm" id="pc-wa-footer" href="#" target="_blank" rel="noopener noreferrer">
          Escribirme
        </a>
      </footer>
    </section>

  </main>

  <script type="module" src="/js/cliente.js"></script>
</body>
</html>
